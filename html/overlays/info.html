<!-- ▼ 出題設定：各項目の説明モーダル -->
<div class="info-overlay" id="info-overlay">
  <div class="info-sheet">
    <div class="info-title">各項目について</div>
    <div class="info-item">
      <div class="info-item-title">問題数</div>
      <div class="info-item-desc">出題される漢字の数。「全問：鬼」は選んでいる難易度の問題を、「全問：忌」は難易度を問わず収録された問題を全て出題する。</div>
      <div class="info-item-stats" id="info-stats-count"></div>
    </div>
    <div class="info-item">
      <div class="info-item-title">難易度</div>
      <div class="info-item-desc">出題される漢字の読みにくさの目安。「全問：忌」を選んでいる間はこの項目は使用されない。</div>
    </div>
    <div class="info-item">
      <div class="info-item-title">解答形式</div>
      <div class="info-item-desc">「選択」は4つの読みから正解を選ぶ方式、「入力」は読みを自分で打ち込む方式。</div>
    </div>
    <div class="info-item">
      <div class="info-item-title">怪異乱入</div>
      <div class="info-item-desc">「あり」にすると、出題中にプレイヤーを驚かせる怪異の演出が発生することがある。難易度に応じて発生確率が異なる。</div>
      <div class="info-item-stats" id="info-stats-kaii"></div>
    </div>
    <button class="btn-secondary" id="btn-info-close">閉じる</button>
  </div>
</div>
