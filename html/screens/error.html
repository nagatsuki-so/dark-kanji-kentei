<!-- ▼ 読込エラー画面 -->
<section id="screen-error" class="screen">
  <div class="glyph-guard" style="color:var(--blood-bright);">封</div>
  <div class="title-block">
    <h2 style="font-family:'Yuji Syuku',serif;font-size:22px;margin:0 0 10px;">問題の召喚に失敗した</h2>
    <p class="sub" id="error-detail" style="line-height:1.7;">問題データを読み込めませんでした。</p>
  </div>
  <button class="btn-start" id="btn-retry-load">再度試みる</button>
</section>
