<!-- ▼ 結果画面 -->
<section id="screen-result" class="screen">
  <button class="link-back link-back-corner" id="btn-result-home">タイトルへ戻る</button>
  <div class="result-main">
    <div class="result-row"><span class="result-label">正答数</span><span class="result-value"><span id="result-score-num">0</span> / <span id="result-score-total">15</span></span></div>
    <div class="result-row"><span class="result-label">称号</span><span class="result-value" id="result-rank">見習い祓魔師</span></div>
    <div class="result-glyph-block" id="result-glyph-block">
      <div class="result-row"><span class="result-label">階級</span></div>
      <div class="result-glyph-big" id="result-glyph">霊</div>
    </div>
  </div>
  <div class="result-actions">
    <button class="btn-start" id="btn-retry-same">同じ出題設定で再挑戦</button>
    <button class="btn-secondary" id="btn-retry-mode">出題設定を選び直す</button>
  </div>
</section>
