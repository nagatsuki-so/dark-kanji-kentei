<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>宵闇漢字解奇譚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- 怪異演出「呪」専用の筆文字フォント。使う文字（呪貴方ノ身体オ終イ）の分だけを読み込む -->
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&text=%E5%91%AA%E8%B2%B4%E6%96%B9%E3%83%8E%E8%BA%AB%E4%BD%93%E3%82%AA%E7%B5%82%E3%82%A4&display=swap" rel="stylesheet">
<!-- スタイルは画面ごとに分けている。kaii.css は他の見た目を上書きするため最後に読み込む -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/mode.css">
<link rel="stylesheet" href="css/quiz.css">
<link rel="stylesheet" href="css/result.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/kaii.css">
</head>
<body>
<!--
  このページは土台だけで、各画面のHTMLは html/ フォルダに分けている。
  data-include の位置に、js/boot.js がページを開いた時に部品を読み込んで差し込む。
  （部品の読み込みに fetch を使うため、ローカルで確認する時もローカルサーバーで開くこと）
-->
<div id="app">
  <div class="fog-layer"></div>
  <div class="embers" id="embers"></div>
  <div class="sound-control">
    <span class="bgm-label">BGM</span>
    <button class="icon-btn global-sound-btn" id="btn-mute" title="音声のON/OFF">🔊</button>
  </div>

  <main>
    <div data-include="html/screens/title.html"></div>
    <div data-include="html/screens/error.html"></div>
    <div data-include="html/screens/mode.html"></div>
    <div data-include="html/screens/quiz.html"></div>
    <div data-include="html/screens/result.html"></div>
  </main>

  <footer class="credit">MADE BY NAGATSUKI</footer>

  <div data-include="html/overlays/feedback.html"></div>
  <div data-include="html/overlays/confirm.html"></div>
  <div data-include="html/overlays/info.html"></div>
  <div data-include="html/kaii.html"></div>
</div>

<script src="js/boot.js"></script>
</body>
</html>
